<!doctype html>
<meta charset="utf-8">
<title>Martin sprite animation</title>
<style>
  body { margin: 0; font: 14px/1.6 system-ui, sans-serif; background: #eef1f5;
         color: #222; display: flex; gap: 32px; padding: 28px; flex-wrap: wrap; }
  .card { background: #fff; border-radius: 10px; padding: 18px 20px;
          box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h2 { margin: 0 0 10px; font-size: 15px; }
  /* ---- 1. pure CSS: steps() over the sheet ------------------------------ */
  .css-sprite {
    width: 362px; height: 724px;
    background: url("martin_smile_sheet.png") 0 0 / 2172px 724px no-repeat;
    animation: play 1s steps(6) infinite;
    image-rendering: pixelated;
    transform: scale(.5); transform-origin: top left;
  }
  @keyframes play { from { background-position: 0 0; } to { background-position: -2172px 0; } }
  /* ---- 2. canvas, driven by the same timeline as Blender ---------------- */
  canvas { image-rendering: pixelated; width: 181px; height: 362px;
           background: #f2f4f7; border-radius: 6px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  button { font: inherit; padding: 4px 12px; border-radius: 6px;
           border: 1px solid #bbb; background: #fafafa; cursor: pointer; }
  code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; }
  .note { max-width: 420px; }
</style>

<div class="card">
  <h2>1. CSS only（等間隔でループ）</h2>
  <div style="width:181px;height:362px;overflow:hidden">
    <div class="css-sprite"></div>
  </div>
  <p class="note">背景画像を <code>steps(6)</code> でずらすだけ。JS不要・軽量ですが、
  コマごとの長さは変えられません。</p>
</div>

<div class="card">
  <h2>2. Canvas（Blenderと同じタイミング）</h2>
  <canvas id="cv" width="362" height="724"></canvas>
  <div class="row">
    <button id="toggle">停止</button>
    <button id="once">1回だけ再生</button>
    <span id="info"></span>
  </div>
  <p class="note">コマ番号と表示フレーム数を配列で持つ方式。ゲーム側の状態に応じて
  「笑い出す」「真顔に戻す」を任意のタイミングで呼べます。</p>
</div>

<script>
const SHEET = "martin_smile_sheet.png";
const FW = 362, FH = 724, FPS = 24;

// Blender の TL と同じ: [コマ番号, 保持フレーム数]
const TIMELINE = [
  [0,10], [1,3], [2,2], [3,2],
  [4,2], [5,2], [4,2], [5,2], [4,2], [5,2], [4,2], [5,3],
  [3,3], [2,3], [1,3], [0,8]
];

const img = new Image();
img.src = SHEET;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

// expand the timeline to one entry per rendered frame
const track = [];
for (const [idx, hold] of TIMELINE) for (let i = 0; i < hold; i++) track.push(idx);

let t0 = null, playing = true, loop = true;
function draw(now) {
  if (t0 === null) t0 = now;
  let f = Math.floor((now - t0) / 1000 * FPS);
  if (f >= track.length) {
    if (!loop) { playing = false; f = track.length - 1; }
    else { f %= track.length; }
  }
  const idx = track[f % track.length];
  ctx.clearRect(0, 0, FW, FH);
  ctx.drawImage(img, idx * FW, 0, FW, FH, 0, 0, FW, FH);
  document.getElementById("info").textContent =
    `frame ${(f % track.length) + 1}/${track.length}  (コマ ${idx})`;
  if (playing) requestAnimationFrame(draw);
}
img.onload = () => requestAnimationFrame(draw);

document.getElementById("toggle").onclick = (e) => {
  playing = !playing;
  e.target.textContent = playing ? "停止" : "再生";
  if (playing) { t0 = null; requestAnimationFrame(draw); }
};
document.getElementById("once").onclick = () => {
  loop = false; playing = true; t0 = null; requestAnimationFrame(draw);
};
</script>
