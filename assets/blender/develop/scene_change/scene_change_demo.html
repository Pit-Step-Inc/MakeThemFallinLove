<!doctype html>
<meta charset="utf-8">
<title>scene_change transition</title>
<style>
  body { margin:0; font:14px/1.6 system-ui, sans-serif; background:#11131a; color:#e6e8ee;
         padding:24px; }
  h1 { font-size:16px; margin:0 0 14px; font-weight:600; }
  .stage { position:relative; width:836px; height:470px; background:#000;
           border-radius:8px; overflow:hidden; box-shadow:0 6px 28px rgba(0,0,0,.5); }
  .stage img { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #scene { z-index:0; }
  #fx    { z-index:1; }
  .row { display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap; }
  button { font:inherit; padding:5px 14px; border-radius:6px; border:1px solid #3a3f4d;
           background:#20242e; color:#e6e8ee; cursor:pointer; }
  button:hover { background:#2a2f3b; }
  code { background:#20242e; padding:1px 6px; border-radius:4px; }
  p.note { max-width:836px; color:#a8aec0; }
  #info { color:#8d94a8; font-variant-numeric:tabular-nums; }
</style>

<h1>scene_change — 1672x941 / 32F / 24fps（表示は 50%）</h1>

<div class="stage">
  <img id="scene" alt="">
  <img id="fx" alt="">
</div>

<div class="row">
  <button id="play">再生</button>
  <button id="step">1コマ送り</button>
  <span id="info"></span>
</div>

<p class="note">裏の絵の差し替えは <code>coverFrames</code>（F21-F22）で行います。
このデモも同じフレームで背景を入れ替えているので、切り替わった瞬間が見えないことを
確認できます。差し替え前は黒、差し替え後は <code>background/background_white</code> です
（<code>SCENES</code> を書き換えれば任意の絵に差し替えられます。<code>null</code> は黒）。</p>

<script>
// 差し替え前後の裏の絵。null はその区間を黒にする（差し替え前は黒＝ユーザー指定）。
const SCENES = [
  null,
  "../../../background/background_white (1).png",
];
const fx = document.getElementById('fx');
const scene = document.getElementById('scene');
const info = document.getElementById('info');
let data = null, frames = [], f = 0, timer = null, which = 0, swapped = false;

function setScene(i) {
  const src = SCENES[i];
  scene.style.display = src ? '' : 'none';
  if (src) scene.src = src;
}
setScene(0);

fetch('scene_change.json').then(r => r.json()).then(d => {
  data = d;
  // JSON の frames（再生順のコマ番号）をそのまま使う
  frames = d.frames;
  for (let i = 0; i < d.frameCount; i++) {
    const im = new Image();
    im.src = d.frameDir + '/scene_change_' + String(i).padStart(2, '0') + '.png';
  }
  draw(0);
});

function draw(i) {
  f = i;
  const idx = frames[i];
  fx.src = data.frameDir + '/scene_change_' + String(idx).padStart(2, '0') + '.png';
  // cover の最初のコマで裏の絵を入れ替える
  if (data.coverFrames.includes(idx) && !swapped) {
    which = 1 - which;
    setScene(which);
    swapped = true;
  }
  info.textContent = 'F' + String(idx).padStart(2, '0') + '  ' + data.labels[idx]
                   + '   alpha ' + data.alpha[idx].toFixed(2);
}

function stop() { if (timer) { clearInterval(timer); timer = null; } }

document.getElementById('play').onclick = () => {
  stop();
  swapped = false;
  which = 0;
  setScene(0);
  draw(0);
  let i = 0;
  timer = setInterval(() => {
    i++;
    if (i >= frames.length) { stop(); return; }
    draw(i);
  }, 1000 / (data ? data.fps : 24));
};

document.getElementById('step').onclick = () => {
  stop();
  draw((f + 1) % frames.length);
};
</script>
