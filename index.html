<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make Them Fall (in love)</title>
<meta name="description" content="Make Them Fall (in love) — タイトル画面">
<link rel="icon" href="assets/UI/title.png">
<link rel="preload" as="font" type="font/ttf" href="assets/font/DotGothic16/DotGothic16-Regular.ttf" crossorigin>
<link rel="stylesheet" href="src/style.css">
</head>
<body>

  <main class="stage" id="stage">

    <!-- ===== タイトル ===== -->
    <section class="scene" id="scene-title">

      <img class="logo"
           src="assets/UI/title.png"
           alt="Make Them Fall (in love)"
           width="1774" height="887"
           fetchpriority="high">

      <nav class="lang-row" aria-label="Language / 言語">
        <button type="button" class="btn" data-lang="en" lang="en">English</button>
        <button type="button" class="btn" data-lang="ja" lang="ja">Japanese</button>
      </nav>

      <p class="hint" id="titleHint" role="status" aria-live="polite"></p>

    </section>

    <!-- ===== ニックネーム入力 ===== -->
    <section class="scene" id="scene-nickname" hidden>

      <button type="button" class="pixel-frame back-btn" id="backBtn"></button>

      <img class="logo logo--small"
           src="assets/UI/title.png"
           alt="Make Them Fall (in love)"
           width="1774" height="887">

      <h1 class="heading" id="nameHeading"></h1>

      <input class="pixel-frame name-input"
             id="nameInput"
             type="text"
             maxlength="7"
             autocomplete="off"
             autocapitalize="off"
             spellcheck="false"
             aria-labelledby="nameHeading">

      <button type="button" class="pixel-frame next-btn" id="nextBtn" disabled></button>

      <p class="hint" id="nicknameHint" role="status" aria-live="polite"></p>

    </section>

    <!-- ===== 部屋（ホストになる / コードで参加） ===== -->
    <section class="scene scene--room" id="scene-room" hidden>

      <img class="logo logo--small"
           src="assets/UI/title.png"
           alt="Make Them Fall (in love)"
           width="1774" height="887">

      <h1 class="heading" id="roomHeading"></h1>

      <button type="button" class="pixel-frame next-btn room-host-btn" id="hostBtn"></button>

      <p class="room-or" id="roomOr"></p>

      <div class="room-join">
        <input class="pixel-frame room-code-input"
               id="roomCodeInput"
               type="text"
               inputmode="latin"
               maxlength="6"
               autocomplete="off" autocapitalize="characters" spellcheck="false"
               aria-labelledby="roomHeading">
        <button type="button" class="pixel-frame room-join-btn" id="joinBtn" disabled></button>
      </div>

      <p class="hint" id="roomHint" role="status" aria-live="polite"></p>

    </section>

    <!-- ===== 日付切り替え ===== -->
    <!-- 参照: assets/reference_image/DayChange.png -->
    <section class="scene scene--day" id="scene-day" hidden>

      <img class="logo logo--day"
           src="assets/UI/title.png"
           alt="Make Them Fall (in love)"
           width="1774" height="887">

      <p class="day-label" id="dayLabel" role="status" aria-live="polite"></p>

      <!-- 歩きは assets/blender/develop/ の PNG シート + JSON。
           解像度はコマの原寸で、表示サイズは CSS 側で決める。 -->
      <canvas class="walker walker--martin"    id="martinWalk"    aria-hidden="true"></canvas>
      <canvas class="walker walker--catherine" id="catherineWalk" aria-hidden="true"></canvas>

      <p class="hint" id="dayHint" role="status" aria-live="polite"></p>

    </section>

    <!-- ===== オープニング（渋谷・1日目冒頭の会話） ===== -->
    <!-- 参照: assets/reference_image/opening_001.png, opening_002.png -->
    <section class="scene scene--opening" id="scene-opening" hidden>

      <!-- 日ごとに街が変わる（1日目は渋谷・2日目は新宿・3日目は池袋）。
           差し替えは src/main.js の OPENING_BACKDROPS -->
      <img class="backdrop" id="openingBackdrop"
           src="assets/background/background_shibuya_001.png"
           alt=""
           width="1672" height="941">

      <!-- 口パクは martin_talk03 / catherine_talk01。
           原寸のまま canvas に描いて CSS で縮める。
           Catherine は合流するまで出さない -->
      <canvas class="portrait portrait--martin"    id="openingMartin"    aria-hidden="true"></canvas>
      <canvas class="portrait portrait--catherine" id="openingCatherine" aria-hidden="true" hidden></canvas>

      <!-- 名札。誰が喋っているかに関わらず出しておく。
           Catherine は合流するまで立ち絵ごと隠す -->
      <span class="name-tag name-tag--martin"    id="openingNameMartin">Martin</span>
      <span class="name-tag name-tag--catherine" id="openingNameCatherine" hidden>Catherine</span>

      <!-- 台詞は1文字ずつ出す。未表示ぶんも DOM には置いたまま透明にして、
           途中で行数が変わって吹き出しの中で文字が飛び跳ねないようにする -->
      <div class="bubble bubble--martin" id="openingBubbleMartin" hidden>
        <p class="bubble-text"><span id="openingShownMartin"></span><span class="bubble-rest" id="openingRestMartin"></span></p>
      </div>

      <div class="bubble bubble--catherine" id="openingBubbleCatherine" hidden>
        <p class="bubble-text"><span id="openingShownCatherine"></span><span class="bubble-rest" id="openingRestCatherine"></span></p>
      </div>


    </section>

    <!-- ===== 次の展開（生成された会話） ===== -->
    <!-- 背景も台詞も BGM も OpenAI から来る（tools/story.py） -->
    <section class="scene scene--opening scene--story" id="scene-story" hidden>

      <img class="backdrop" id="storyBackdrop" alt="" width="1792" height="1024">

      <canvas class="portrait portrait--martin"          id="storyMartin"    aria-hidden="true"></canvas>
      <canvas class="portrait portrait--catherine-story" id="storyCatherine" aria-hidden="true"></canvas>

      <span class="name-tag name-tag--martin"          id="storyNameMartin">Martin</span>
      <span class="name-tag name-tag--catherine-story" id="storyNameCatherine">Catherine</span>

      <div class="bubble bubble--martin" id="storyBubbleMartin" hidden>
        <p class="bubble-text"><span id="storyShownMartin"></span><span class="bubble-rest" id="storyRestMartin"></span></p>
      </div>

      <div class="bubble bubble--catherine" id="storyBubbleCatherine" hidden>
        <p class="bubble-text"><span id="storyShownCatherine"></span><span class="bubble-rest" id="storyRestCatherine"></span></p>
      </div>

    </section>

    <!-- ===== ラストシーン（Catherine の独り言） ===== -->
    <!-- 参照: assets/reference_image/LastScene.png
         台詞は assets/Prompt/003.txt から作られる。Martin は出ないので、
         talkScene は要素が無いキャラを飛ばす作りにしてある -->
    <section class="scene scene--last" id="scene-last" hidden>

      <img class="logo logo--last"
           src="assets/UI/title.png"
           alt="Make Them Fall (in love)"
           width="1774" height="887">

      <canvas class="portrait portrait--catherine-last" id="lastCatherine" aria-hidden="true"></canvas>

      <span class="name-tag name-tag--catherine-last" id="lastNameCatherine">Catherine</span>

      <div class="bubble bubble--catherine" id="lastBubbleCatherine" hidden>
        <p class="bubble-text"><span id="lastShownCatherine"></span><span class="bubble-rest" id="lastRestCatherine"></span></p>
      </div>

      <!-- 3日ぶんの積み上がった親密度を数字でも出す（ゲージは上に出ている） -->
      <p class="final-affinity" id="finalAffinity" hidden>
        <span class="final-affinity__label" id="finalAffinityLabel"></span>
        <span class="final-affinity__value" id="finalAffinityValue"></span>
      </p>

    </section>

    <!-- ===== ランダムイベントの予告 ===== -->
    <!-- 2日目の冒頭のあとに割り込む。サイレンを鳴らしているあいだに
         出来事を作り、決まったら渦の画面へ移してお題として出す
         （assets/Prompt/004.txt） -->
    <section class="scene scene--event" id="scene-event" hidden>

      <p class="event-heading" id="eventHeading"></p>

    </section>

    <!-- ===== 未来（10年後・20年後・30年後） ===== -->
    <!-- 組み方は会話の画面と同じ（参照: Memory_001.png, Memory_002.png）。
         背景は3日間の出来事に連なる情景として生成される -->
    <section class="scene scene--opening scene--memory" id="scene-memory" hidden>

      <img class="backdrop" id="memoryBackdrop" alt="" width="1792" height="1024">

      <canvas class="portrait portrait--martin"    id="memoryMartin"    aria-hidden="true"></canvas>
      <canvas class="portrait portrait--catherine" id="memoryCatherine" aria-hidden="true"></canvas>

      <span class="name-tag name-tag--martin"    id="memoryNameMartin">Martin</span>
      <span class="name-tag name-tag--catherine" id="memoryNameCatherine">Catherine</span>

      <!-- 何年後かの見出し -->
      <p class="memory-year" id="memoryYear"></p>

      <div class="bubble bubble--martin" id="memoryBubbleMartin" hidden>
        <p class="bubble-text"><span id="memoryTextMartin"></span></p>
      </div>

      <div class="bubble bubble--catherine" id="memoryBubbleCatherine" hidden>
        <p class="bubble-text"><span id="memoryTextCatherine"></span></p>
      </div>

    </section>

    <!-- ===== エンディング ===== -->
    <!-- 参照: assets/reference_image/Ending_001.png, Ending_002.png
         ロゴと歩く二人は出しっぱなしで、真ん中だけ
         TOP PLAYERS → スタッフロール → The End と入れ替える -->
    <section class="scene scene--day scene--ending" id="scene-ending" hidden>

      <img class="logo logo--day"
           src="assets/UI/title.png"
           alt="Make Them Fall (in love)"
           width="1774" height="887">

      <canvas class="walker walker--martin"    id="endMartinWalk"    aria-hidden="true"></canvas>
      <canvas class="walker walker--catherine" id="endCatherineWalk" aria-hidden="true"></canvas>

      <!-- 上位3名 -->
      <div class="top-players" id="topPlayers" hidden>
        <p class="top-players__heading" id="topPlayersHeading"></p>
        <ul class="top-players__list" id="topPlayersList"></ul>
      </div>

      <!-- スタッフロール。中身は endingScene.js の CREDITS から組む -->
      <div class="credits" id="credits" hidden>
        <div class="credits__roll" id="creditsRoll"></div>
      </div>

      <!-- 親密度が満タンに届かなかったとき -->
      <div class="not-over" id="notOver" hidden>
        <p class="not-over__title" id="notOverTitle"></p>
        <p class="not-over__body"  id="notOverBody"></p>
      </div>

      <!-- 締め -->
      <p class="end-label" id="endLabel" hidden></p>

      <!-- The End のあとだけ出す。押すとタイトルからやり直せる -->
      <button type="button" class="pixel-frame title-btn" id="backToTitleBtn" hidden></button>

    </section>

    <!-- ===== シーン切り替え ===== -->
    <!-- 参照: assets/reference_image/scene_change.png -->
    <section class="scene scene--change" id="scene-change" hidden>

      <!-- 背景のワープ。1コマ 1672x941 の連番 PNG を src の差し替えで回す -->
      <img class="change-fx" id="changeFx" alt="" width="1672" height="941">

      <ul class="prompt-cards" id="changeCards"></ul>

      <p class="change-heading" id="changeHeading"></p>

      <!-- いちばんいいねが多かった Prompt -->
      <div class="change-hero" id="changeHero" hidden></div>

    </section>

    <!-- ===== 全シーン共通 ===== -->

    <!-- ===== Prompt 入力フェーズ =====
         参照: assets/reference_image/InputPrompt.png

         **シーンの外に置いてある。** 会話が終わると、そのときの画面の上に
         そのまま重なる（1回目は渋谷、2回目からは生成された背景）。
         シーンを切り替えないのは、切り替えると黒を挟んでしまうため。 -->
    <div class="prompt" id="promptPhase" hidden>

      <!-- 投稿された Prompt を最大5つ。空きは ○○○ のまま出しておく -->
      <ul class="prompt-cards" id="promptCards"></ul>

      <div class="pixel-panel prompt-timer">
        <span class="prompt-timer__label" id="promptLabel"></span>
        <span class="prompt-timer__count" id="promptCount">60</span>
      </div>

      <!-- 揃うのを待たずに始める。ホストにだけ出す -->
      <button type="button" class="pixel-panel prompt-start" id="promptStart" hidden></button>

      <label class="pixel-panel prompt-input">
        <span class="sr-only" id="promptInputLabel"></span>
        <!-- 実際の上限は言語で変わる。promptScene.js が maxLength を入れ直す -->
        <input type="text" id="promptInput"
               maxlength="50"
               autocomplete="off" autocapitalize="off" spellcheck="false"
               aria-labelledby="promptInputLabel">
      </label>

    </div>

    <!-- 親密度。Prompt 入力と生成された展開の両方で同じ場所に出すので、
         シーンの外に置いてある -->
    <div class="affection" id="affection" role="progressbar"
         aria-label="Catherine" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
      <!-- 素材の抜けている形に切り抜く器。中の帯はこの形の中でだけ見える -->
      <div class="affection__hole">
        <div class="affection__fill" id="affectionFill"></div>
      </div>
    </div>

    <!-- 部屋コードの札。押すとコピーできる。通知と同じくシーンの外に置く -->
    <button type="button" class="code-chip" id="codeChip" hidden>
      <span class="code-chip__label" id="codeChipLabel"></span>
      <span class="code-chip__value" id="codeChipValue"></span>
    </button>

    <!-- 参加・退出の通知。どの画面でも同じ場所に出したいので .scene の外に置く -->
    <ul class="toasts" id="toasts" role="status" aria-live="polite"></ul>

    <button type="button" class="sound-toggle" id="soundToggle"
            aria-pressed="false" title="BGM (M)">
      <span aria-hidden="true" id="soundIcon">&#9834;</span>
      <span class="sr-only">BGM のオン / オフ</span>
    </button>

  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
